# yaml-language-server: $schema=./config.schema.json
logging: INFO
# meter_type selects the provider profile. Supported:
#   burgenland (default) — Landis+Gyr E450 via DLMS/HDLC (Netz Burgenland)
#   noe_evn              — Sagemcom T210-D via M-Bus (Netz NÖ / EVN)
#   wien                 — Wiener Netze (IM350, AM550, E450, …) via DLMS/HDLC
# Untested, implemented from the specification (real telegrams wanted):
#   steiermark           — Energienetze Steiermark, Landis+Gyr E450 via M-Bus
#   steiermark_sagemcom  — Energienetze Steiermark, Sagemcom via DSMR P1
#   salzburg             — Salzburg Netz, Kaifa / Honeywell via M-Bus
#   tirol                — TINETZ, Kaifa / Honeywell via M-Bus
#   h1                   — Smart Meter 2.0 H1 customer interface (DSMR P1)
# meter_type: burgenland
interface_type: OPTICAL

mqtt:
  # device_id: "smartmeter"
  # name: "Smart Meter"
  host: "example.com"
  # port: 1883
  user: ""
  password: ""
  # keepalive: 60
  # prefix: ""

dlms:
  port: "/dev/ttyUSB0"
  # Serial settings default to the selected meter_type; only set them to
  # override (burgenland/wien: 9600 8N1; noe_evn, steiermark, salzburg,
  # tirol: 2400 8E1; h1, steiermark_sagemcom: 115200 8N1).
  # baudrate: 9600
  # bytesize: 8
  # parity: "NONE"
  # stopbits: 1
  key: "012345678901234567890123456789ab" # hex key to decrypt message
