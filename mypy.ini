[mypy]
python_version = 3.15
files = packages/smartmeter-austria/src/smartmeter_austria, smartmeter/meter
explicit_package_bases = true
mypy_path = packages/smartmeter-austria/src:smartmeter
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true

# Third-party libs without type stubs
[mypy-gurux_common.*]
ignore_missing_imports = true

[mypy-gurux_dlms.*]
ignore_missing_imports = true

[mypy-paho.*]
ignore_missing_imports = true

[mypy-serial.*]
ignore_missing_imports = true

[mypy-bs4.*]
ignore_missing_imports = true

[mypy-bashio.*]
ignore_missing_imports = true

[mypy-yaml]
ignore_missing_imports = true
