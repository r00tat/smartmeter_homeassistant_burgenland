name: "Pull Request"

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  pull_request:
    name: "Lint and Test"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"

      - name: "Set up Python"
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15"
          cache: "pip"

      - name: "Install requirements"
        run: |
          python3 -m pip install uv &&
          uv venv &&
          source .venv/bin/activate &&
          uv pip install -r smartmeter/requirements-dev.txt -e packages/smartmeter-austria

      - name: "Apply the same gurux fix-up as the Dockerfiles"
        run: |
          source .venv/bin/activate &&
          python3 -m smartmeter_austria.fix_source_encoding gurux_dlms gurux_common

      - name: "Lint"
        run: |
          source .venv/bin/activate &&
          python3 -m ruff check packages/smartmeter-austria smartmeter

      - name: "Type check"
        run: |
          source .venv/bin/activate &&
          python3 -m mypy --config-file mypy.ini

      - name: "Test"
        run: |
          source .venv/bin/activate &&
          (cd packages/smartmeter-austria && python3 -m pytest tests/ -v) &&
          (cd smartmeter && python3 -m pytest tests/ -v)

  build-library:
    name: "Build smartmeter-austria"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"

      - name: "Set up Python"
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15"

      - name: "Build sdist and wheel"
        run: |
          python3 -m pip install uv twine &&
          uv build packages/smartmeter-austria --out-dir dist &&
          python3 -m twine check --strict dist/*

      - name: "Check the wheel contents"
        run: |
          unzip -l dist/*.whl | tee -a "$GITHUB_STEP_SUMMARY"
          unzip -l dist/*.whl | grep -q "smartmeter_austria/profile.py"
          ! unzip -l dist/*.whl | grep -E "tests/|scripts/"

  test-build:
    name: "Test build ${{ matrix.arch }} image"
    needs: pull_request
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"

      - name: "Test build ${{ matrix.arch }} image"
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: .
          file: smartmeter/Dockerfile
          image: docker.io/paulwoelfel/smartmeter_homeassistant_burgenland_${{ matrix.arch }}
          image-tags: test
          version: test
          container-registry-password: "unused"
          push: "false"
          cosign: "false"

  test-build-standalone:
    name: "Test build standalone multi-arch image"
    needs: pull_request
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"

      - name: "Set up QEMU"
        uses: docker/setup-qemu-action@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "Test build standalone image"
        uses: docker/build-push-action@v7
        with:
          context: .
          file: smartmeter/Dockerfile.standalone
          platforms: linux/amd64,linux/arm64
          push: false
