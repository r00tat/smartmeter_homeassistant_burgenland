name: "Release"

on:
  release:
    types:
      - "published"

permissions: {}

jobs:
  prepare:
    name: "Prepare release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.release-sha.outputs.sha }}
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"

      - name: "Adjust version number"
        shell: "bash"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          yq -i '.version=strenv(RELEASE_TAG)' \
            "${{ github.workspace }}/smartmeter/config.yaml"
          # The integration pins the library release of the same tag.
          manifest="${{ github.workspace }}/custom_components/smartmeter_at/manifest.json"
          jq --arg v "$RELEASE_TAG" '.version=$v
            | .requirements |= map(if startswith("smartmeter-austria==")
                                   then "smartmeter-austria==" + $v else . end)' \
            "$manifest" > "$manifest.tmp"
          mv "$manifest.tmp" "$manifest"
          sed -i -E "s/^version = \".*\"$/version = \"$RELEASE_TAG\"/" \
            "${{ github.workspace }}/smartmeter/smartmeter-austria/pyproject.toml"
          grep -q "^version = \"$RELEASE_TAG\"$" \
            "${{ github.workspace }}/smartmeter/smartmeter-austria/pyproject.toml"
          python3 .github/scripts/check_requirements_sync.py

      - name: "✏️ Generate release changelog"
        id: changelog
        uses: janheinrichmerker/action-github-changelog-generator@v2.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "write changelog"
        env:
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          set -x
          echo "writing log file"
          echo "$CHANGELOG" | sed 's@%0A@\n@g' > smartmeter/CHANGELOG.md
          echo "Current changelog:"
          cat smartmeter/CHANGELOG.md
          echo "CHANGELOG updated."

      - name: Commit config.yaml
        id: auto-commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: main
          commit_message: "Update version to ${{ github.event.release.tag_name }} and update CHANGELOG.md"
          file_pattern: smartmeter/config.yaml smartmeter/CHANGELOG.md custom_components/smartmeter_at/manifest.json smartmeter/smartmeter-austria/pyproject.toml

      - name: "Determine release commit"
        id: release-sha
        env:
          COMMIT_HASH: ${{ steps.auto-commit.outputs.commit_hash }}
        run: |
          # Without changes no commit is made; fall back to the checked-out commit.
          echo "sha=${COMMIT_HASH:-$(git rev-parse HEAD)}" >> "$GITHUB_OUTPUT"

  pypi:
    name: "Publish smartmeter-austria to PyPI"
    needs: prepare
    runs-on: "ubuntu-latest"
    # PyPI Trusted Publishing: no token, PyPI trusts this workflow and
    # environment (configured once on pypi.org, see docs/en/development.md).
    environment:
      name: pypi
      url: https://pypi.org/project/smartmeter-austria/${{ github.event.release.tag_name }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: "Checkout the release commit"
        uses: "actions/checkout@v7.0.1"
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: "Set up Python"
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15"

      - name: "Build sdist and wheel"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 -m pip install uv twine
          uv build smartmeter/smartmeter-austria --out-dir dist
          python3 -m twine check --strict dist/*
          ls dist/ | grep -F -- "-$RELEASE_TAG"

      - name: "Publish to PyPI"
        uses: pypa/gh-action-pypi-publish@v1.14.3

  build:
    name: "Build ${{ matrix.arch }} image"
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"
        with:
          ref: main

      - name: "Build and publish ${{ matrix.arch }} image"
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: smartmeter
          image: docker.io/paulwoelfel/smartmeter_homeassistant_burgenland_${{ matrix.arch }}
          image-tags: |
            ${{ github.event.release.tag_name }}
            latest
          version: ${{ github.event.release.tag_name }}
          container-registry: docker.io
          container-registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
          container-registry-password: ${{ secrets.DOCKERHUB_TOKEN }}
          push: "true"
          cosign: "false"

  build-standalone:
    name: "Build and publish standalone multi-arch image"
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"
        with:
          ref: main

      - name: "Set up QEMU"
        uses: docker/setup-qemu-action@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "Log in to Docker Hub"
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Build and push standalone image"
        uses: docker/build-push-action@v7
        with:
          context: smartmeter
          file: smartmeter/Dockerfile.standalone
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/paulwoelfel/smartmeter_homeassistant_burgenland_standalone:${{ github.event.release.tag_name }}
            docker.io/paulwoelfel/smartmeter_homeassistant_burgenland_standalone:latest

  integration-zip:
    name: "Attach HACS zip"
    # The zip pins smartmeter-austria of this release: only publish it once
    # Home Assistant can install that version from PyPI.
    needs: [prepare, pypi]
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - name: "Checkout the release commit"
        uses: "actions/checkout@v7.0.1"
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: "Build smartmeter_at.zip"
        run: |
          cd custom_components/smartmeter_at
          zip -r ../../smartmeter_at.zip . -x '__pycache__/*' '*/__pycache__/*'
          cd ../..
          unzip -l smartmeter_at.zip | grep -E 'manifest.json'

      - name: "Upload to the release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" smartmeter_at.zip --clobber
