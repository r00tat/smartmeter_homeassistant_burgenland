name: "Home Assistant integration"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  hassfest:
    name: "hassfest"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - uses: "actions/checkout@v7.0.1"
      - uses: "home-assistant/actions/hassfest@master"

  hacs:
    name: "HACS validation"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - uses: "hacs/action@main"
        with:
          category: "integration"

  tests:
    name: "Integration tests"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"

      - name: "Set up Python"
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: "tests_integration/.python-version"
          allow-prereleases: true
          cache: "pip"

      - name: "Check the library pin"
        run: python3 .github/scripts/check_requirements_sync.py

      - name: "Install requirements"
        run: |
          python3 -m pip install uv &&
          uv venv -p "$(command -v python3)" &&
          source .venv/bin/activate &&
          uv pip install -r requirements-ha-test.txt -e packages/smartmeter-austria ruff

      - name: "Apply the gurux fix-up"
        run: |
          source .venv/bin/activate &&
          python3 -m smartmeter_austria.fix_source_encoding gurux_dlms gurux_common

      - name: "Lint"
        run: |
          source .venv/bin/activate &&
          python3 -m ruff check custom_components tests_integration .github/scripts

      - name: "Test"
        run: |
          source .venv/bin/activate &&
          python3 -m pytest tests_integration -v
